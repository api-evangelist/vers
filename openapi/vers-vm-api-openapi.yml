openapi: 3.1.0
info:
  title: Orchestrator Control Plane commit_tags vm API
  description: ''
  license:
    name: ''
  version: 0.1.0
tags:
- name: vm
paths:
  /api/v1/vm/branch/by_commit/{commit_id}:
    post:
      tags:
      - vm
      operationId: branch_by_commit
      parameters:
      - name: commit_id
        in: path
        description: The commit id to branch off
        required: true
        schema:
          type: string
      - name: count
        in: query
        description: Number of VMs to branch (optional; default 1)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '201':
          description: Branch VM(s) created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewVmsResponse'
        '400':
          description: Invalid VM ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewVmsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewVmsResponse'
        '404':
          description: VM not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewVmsResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewVmsResponse'
      security:
      - bearer_auth: []
  /api/v1/vm/branch/by_ref/{repo_name}/{tag_name}:
    post:
      tags:
      - vm
      operationId: branch_by_ref
      parameters:
      - name: repo_name
        in: path
        description: The repository name
        required: true
        schema:
          type: string
      - name: tag_name
        in: path
        description: The tag name within the repository
        required: true
        schema:
          type: string
      - name: count
        in: query
        description: Number of VMs to branch (optional; default 1)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '201':
          description: Branch VM(s) created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewVmsResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewVmsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewVmsResponse'
        '404':
          description: Repository or tag not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewVmsResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewVmsResponse'
      security:
      - bearer_auth: []
  /api/v1/vm/branch/by_tag/{tag_name}:
    post:
      tags:
      - vm
      operationId: branch_by_tag
      parameters:
      - name: tag_name
        in: path
        description: The tag name to branch off
        required: true
        schema:
          type: string
      - name: count
        in: query
        description: Number of VMs to branch (optional; default 1)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '201':
          description: Branch VM(s) created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewVmsResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewVmsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewVmsResponse'
        '404':
          description: Tag not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewVmsResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewVmsResponse'
      security:
      - bearer_auth: []
  /api/v1/vm/branch/by_vm/{vm_id}:
    post:
      tags:
      - vm
      operationId: branch_by_vm
      parameters:
      - name: vm_id
        in: path
        description: VM to commit and then branch off of
        required: true
        schema:
          type: string
      - name: keep_paused
        in: query
        description: If true, keep VM paused after commit
        required: false
        schema:
          type: boolean
      - name: skip_wait_boot
        in: query
        description: If true, immediately return an error if VM is booting instead of waiting
        required: false
        schema:
          type: boolean
      - name: count
        in: query
        description: Number of VMs to branch (optional; default 1)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '201':
          description: Branch VM(s) created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewVmsResponse'
        '400':
          description: Invalid VM ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewVmsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewVmsResponse'
        '404':
          description: VM not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewVmsResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewVmsResponse'
      security:
      - bearer_auth: []
  /api/v1/vm/from_commit:
    post:
      tags:
      - vm
      operationId: restore_from_commit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FromCommitVmRequest'
        required: true
      responses:
        '201':
          description: VM restored from commit successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewVmResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Cluster not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /api/v1/vm/new_root:
    post:
      tags:
      - vm
      operationId: create_new_root_vm
      parameters:
      - name: wait_boot
        in: query
        description: 'If true, wait for the newly-created VM to finish booting before returning. Default: false.'
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRootRequest'
        required: true
      responses:
        '201':
          description: VM created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewVmResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /api/v1/vm/{vm_id}:
    delete:
      tags:
      - vm
      operationId: delete_vm
      parameters:
      - name: vm_id
        in: path
        description: VM ID to delete
        required: true
        schema:
          type: string
      - name: skip_wait_boot
        in: query
        description: 'If true, return an error immediately if the VM is still booting. Default: false'
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: VM deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VmDeleteResponse'
        '400':
          description: Invalid VM ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: VM not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /api/v1/vm/{vm_id}/commit:
    post:
      tags:
      - vm
      operationId: commit_vm
      parameters:
      - name: vm_id
        in: path
        description: VM ID to commit
        required: true
        schema:
          type: string
      - name: keep_paused
        in: query
        description: If true, keep VM paused after commit
        required: false
        schema:
          type: boolean
      - name: skip_wait_boot
        in: query
        description: 'If true, return an error immediately if the VM is still booting. Default: false'
        required: false
        schema:
          type: boolean
      requestBody:
        description: Optional commit metadata
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VmCommitRequest'
        required: true
      responses:
        '201':
          description: VM committed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VmCommitResponse'
        '400':
          description: Invalid VM ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: VM not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /api/v1/vm/{vm_id}/disk:
    patch:
      tags:
      - vm
      operationId: resize_vm_disk
      parameters:
      - name: vm_id
        in: path
        description: VM ID whose disk to resize
        required: true
        schema:
          type: string
          format: uuid
      - name: skip_wait_boot
        in: query
        description: 'If true, return an error immediately if the VM is still booting. Default: false'
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VmResizeDiskRequest'
        required: true
      responses:
        '200':
          description: VM disk resized successfully
        '400':
          description: Invalid request (e.g. new size not larger than current)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: VM not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /api/v1/vm/{vm_id}/exec:
    post:
      tags:
      - vm
      operationId: exec_vm
      parameters:
      - name: vm_id
        in: path
        description: VM ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VmExecRequest'
        required: true
      responses:
        '200':
          description: Command executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VmExecResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: VM not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /api/v1/vm/{vm_id}/exec/stream:
    post:
      tags:
      - vm
      operationId: exec_vm_stream
      parameters:
      - name: vm_id
        in: path
        description: VM ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VmExecRequest'
        required: true
      responses:
        '200':
          description: NDJSON stream of stdout/stderr chunks
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: VM not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /api/v1/vm/{vm_id}/exec/stream/attach:
    post:
      tags:
      - vm
      operationId: exec_vm_stream_attach
      parameters:
      - name: vm_id
        in: path
        description: VM ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VmExecStreamAttachRequest'
        required: true
      responses:
        '200':
          description: NDJSON stream replaying from cursor
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: VM not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /api/v1/vm/{vm_id}/files:
    get:
      tags:
      - vm
      operationId: read_file_vm
      parameters:
      - name: vm_id
        in: path
        description: VM ID
        required: true
        schema:
          type: string
          format: uuid
      - name: path
        in: query
        description: Absolute path of the file to read
        required: true
        schema:
          type: string
      responses:
        '200':
          description: File contents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VmReadFileResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: VM not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
    put:
      tags:
      - vm
      operationId: write_file_vm
      parameters:
      - name: vm_id
        in: path
        description: VM ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VmWriteFileRequest'
        required: true
      responses:
        '200':
          description: File written successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: VM not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /api/v1/vm/{vm_id}/label:
    patch:
      tags:
      - vm
      operationId: label_vm
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelVmRequest'
        required: true
      responses:
        '200':
          description: Labels set successfully
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /api/v1/vm/{vm_id}/logs:
    get:
      tags:
      - vm
      operationId: vm_logs
      parameters:
      - name: vm_id
        in: path
        description: VM ID
        required: true
        schema:
          type: string
          format: uuid
      - name: offset
        in: query
        description: 'Byte offset into the log file (default: 0)'
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: max_entries
        in: query
        description: Maximum number of log entries to return
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: stream
        in: query
        description: Filter by 'stdout' or 'stderr'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Exec logs retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VmExecLogResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: VM not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /api/v1/vm/{vm_id}/metadata:
    get:
      tags:
      - vm
      operationId: get_vm_metadata
      parameters:
      - name: vm_id
        in: path
        description: VM ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: VM metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VmMetadataResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: VM not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /api/v1/vm/{vm_id}/ssh_key:
    get:
      tags:
      - vm
      operationId: ssh_key
      parameters:
      - name: vm_id
        in: path
        description: Node ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: List all VMs on node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VmSshKeyResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: VM not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /api/v1/vm/{vm_id}/state:
    patch:
      tags:
      - vm
      operationId: update_vm_state
      parameters:
      - name: vm_id
        in: path
        description: VM ID
        required: true
        schema:
          type: string
          format: uuid
      - name: skip_wait_boot
        in: query
        description: If true, error immediately if the VM is not finished booting. Defaults to false
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VmUpdateStateRequest'
        required: true
      responses:
        '200':
          description: VM state updated successfully
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: VM not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /api/v1/vm/{vm_id}/status:
    get:
      tags:
      - vm
      operationId: vm_status
      parameters:
      - name: vm_id
        in: path
        description: VM ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Get status of a specific VM
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VM'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: VM not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /api/v1/vm/{vm_or_commit_id}/branch:
    post:
      tags:
      - vm
      operationId: branch_vm
      parameters:
      - name: vm_or_commit_id
        in: path
        description: Parent VM or commit ID
        required: true
        schema:
          type: string
      - name: keep_paused
        in: query
        description: If true, keep VM paused after commit. Only applicable when branching a VM ID.
        required: false
        schema:
          type: boolean
      - name: skip_wait_boot
        in: query
        description: If true, immediately return an error if VM is booting instead of waiting. Only applicable when branching a VM ID.
        required: false
        schema:
          type: boolean
      - name: count
        in: query
        description: Number of VMs to branch (optional; default 1)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '201':
          description: Branch VM created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewVmsResponse'
        '400':
          description: Invalid VM ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: VM not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
components:
  schemas:
    VmCommitRequest:
      type: object
      description: The request body for POST /api/vm/{vm_id}/commit
      properties:
        commit_id:
          type:
          - string
          - 'null'
          format: uuid
          description: If provided, chelsea will use the requested commit UUID. Otherwise, it will generate a UUID itself.
        description:
          type:
          - string
          - 'null'
          description: Optional description for the commit.
        name:
          type:
          - string
          - 'null'
          description: Optional human-readable name for the commit. Defaults to auto-generated name if not provided.
    VmUpdateStateRequest:
      type: object
      description: Request body for PATCH /api/vm/{vm_id}/state
      required:
      - state
      properties:
        state:
          $ref: '#/components/schemas/VmUpdateStateEnum'
          description: The requested state for the VM
    VmExecLogStream:
      type: string
      description: Streams available for exec logging.
      enum:
      - stdout
      - stderr
    VmExecLogResponse:
      type: object
      description: Response for exec log tail requests.
      required:
      - entries
      - next_offset
      - eof
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/VmExecLogEntry'
          description: Returned log entries.
        eof:
          type: boolean
          description: True when the end of file was reached.
        next_offset:
          type: integer
          format: int64
          description: Next byte offset to continue from.
          minimum: 0
    VmExecLogEntry:
      type: object
      description: Individual log entry describing emitted stdout/stderr chunk.
      required:
      - timestamp
      - stream
      - data_b64
      properties:
        data_b64:
          type: string
          description: Base64-encoded bytes from stdout/stderr chunk.
        exec_id:
          type:
          - string
          - 'null'
          format: uuid
        stream:
          $ref: '#/components/schemas/VmExecLogStream'
        timestamp:
          type: string
    VM:
      type: object
      required:
      - vm_id
      - owner_id
      - created_at
      - state
      properties:
        created_at:
          type: string
          format: date-time
        labels:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          propertyNames:
            type: string
        owner_id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/VmState'
        vm_id:
          type: string
          format: uuid
    VmCommitResponse:
      type: object
      description: The response body for POST /api/vm/{vm_id}/commit
      required:
      - commit_id
      properties:
        commit_id:
          type: string
          format: uuid
          description: The UUID of the newly-created commit
    VmExecStreamAttachRequest:
      type: object
      description: Request body for POST /api/vm/{vm_id}/exec/stream/attach
      required:
      - exec_id
      properties:
        cursor:
          type:
          - integer
          - 'null'
          format: int64
          description: Optional cursor to resume from (exclusive). If omitted, the full retained backlog is replayed.
          minimum: 0
        exec_id:
          type: string
          format: uuid
          description: Identifier of the exec stream session to reattach to.
        from_latest:
          type:
          - boolean
          - 'null'
          description: Start streaming after the latest retained chunk (ignores cursor).
    VmUpdateStateEnum:
      type: string
      description: Possible options for the state requested in PATCH /api/vm/{vm_id}/state
      enum:
      - Paused
      - Running
    NewVmsResponse:
      type: object
      required:
      - vms
      properties:
        vms:
          type: array
          items:
            $ref: '#/components/schemas/NewVmResponse'
    VmWriteFileRequest:
      type: object
      description: Request body for PUT /api/vm/{vm_id}/files
      required:
      - path
      - content_b64
      properties:
        content_b64:
          type: string
          description: File contents, base64-encoded.
        create_dirs:
          type: boolean
          description: Create parent directories if they don't exist.
        mode:
          type: integer
          format: int32
          description: File mode (e.g. 0644). Defaults to 0644 if omitted.
          minimum: 0
        path:
          type: string
          description: Destination path on the VM.
    VmMetadataResponse:
      type: object
      description: Response for GET /api/v1/vm/{vm_id}/metadata
      required:
      - vm_id
      - owner_id
      - created_at
      - state
      - ip
      properties:
        created_at:
          type: string
          format: date-time
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
        grandparent_vm_id:
          type:
          - string
          - 'null'
          format: uuid
        ip:
          type: string
        owner_id:
          type: string
          format: uuid
        parent_commit_id:
          type:
          - string
          - 'null'
          format: uuid
        state:
          $ref: '#/components/schemas/VmState'
        vm_id:
          type: string
          format: uuid
    VmExecRequest:
      type: object
      description: Request body for POST /api/vm/{vm_id}/exec
      required:
      - command
      properties:
        command:
          type: array
          items:
            type: string
          description: Command and arguments to execute.
        env:
          type:
          - object
          - 'null'
          description: Optional environment variables to set for the process.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        exec_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Optional exec identifier for tracking.
        stdin:
          type:
          - string
          - 'null'
          description: Optional stdin payload passed to the command.
        timeout_secs:
          type:
          - integer
          - 'null'
          format: int64
          description: Timeout in seconds (0 = no timeout).
          minimum: 0
        working_dir:
          type:
          - string
          - 'null'
          description: Optional working directory for the command.
    VmSshKeyResponse:
      type: object
      description: Response body for GET /api/vm/{vm_id}/ssh_key
      required:
      - ssh_private_key
      - ssh_port
      properties:
        ssh_port:
          type: integer
          format: int32
          description: The SSH port that will be DNAT'd to the VM's netns (and, in turn, to its TAP device)
          minimum: 0
        ssh_private_key:
          type: string
          description: Private SSH key in stringified OpenSSH format
    VmResizeDiskRequest:
      type: object
      description: Request body for PATCH /api/vm/{vm_id}/disk
      required:
      - fs_size_mib
      properties:
        fs_size_mib:
          type: integer
          format: int32
          description: The new disk size in MiB. Must be strictly greater than the current size.
          minimum: 0
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Reason of error
        success:
          type: boolean
          description: 'Is always: false'
    VmCreateVmConfig:
      type: object
      description: Struct representing configuration options common to all VMs
      properties:
        fs_size_mib:
          type:
          - integer
          - 'null'
          format: int32
          description: The disk size, in MiB.
          minimum: 0
        image_name:
          type:
          - string
          - 'null'
          description: The filesystem base image name. Currently, must be 'default'
        kernel_name:
          type:
          - string
          - 'null'
          description: The kernel name. Currently, must be 'default.bin'
        labels:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          propertyNames:
            type: string
        mem_size_mib:
          type:
          - integer
          - 'null'
          format: int32
          description: The RAM size, in MiB.
          minimum: 0
        vcpu_count:
          type:
          - integer
          - 'null'
          format: int32
          description: How many vCPUs to allocate to this VM (and its children)
          minimum: 0
    NewRootRequest:
      type: object
      required:
      - vm_config
      properties:
        vm_config:
          $ref: '#/components/schemas/VmCreateVmConfig'
    FromCommitVmRequest:
      oneOf:
      - type: object
        description: The commit ID to restore from
        required:
        - commit_id
        properties:
          commit_id:
            type: string
            format: uuid
            description: The commit ID to restore from
      - type: object
        description: The tag name to restore from (legacy org-scoped tag)
        required:
        - tag_name
        properties:
          tag_name:
            type: string
            description: The tag name to restore from (legacy org-scoped tag)
      - type: object
        description: A repository reference in "repo_name:tag_name" format
        required:
        - ref
        properties:
          ref:
            type: string
            description: A repository reference in "repo_name:tag_name" format
      description: Request body for POST /api/v1/vm/from_commit
    LabelVmRequest:
      type: object
      properties:
        labels:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          propertyNames:
            type: string
    VmReadFileResponse:
      type: object
      description: Response body for GET /api/vm/{vm_id}/files
      required:
      - content_b64
      properties:
        content_b64:
          type: string
          description: File contents, base64-encoded.
    NewVmResponse:
      type: object
      description: Response body for new VM requests (new_root, from_commit, branch)
      required:
      - vm_id
      properties:
        vm_id:
          type: string
    VmExecResponse:
      type: object
      description: Response body for POST /api/vm/{vm_id}/exec
      required:
      - exit_code
      - stdout
      - stderr
      properties:
        exec_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Exec identifier associated with this run.
        exit_code:
          type: integer
          format: int32
          description: Exit code returned by the command.
        stderr:
          type: string
          description: UTF-8 decoded stderr (lossy).
        stdout:
          type: string
          description: UTF-8 decoded stdout (lossy).
    VmState:
      type: string
      description: The state of a VM
      enum:
      - booting
      - running
      - paused
      - sleeping
      - dead
    VmDeleteResponse:
      type: object
      description: Response body for DELETE /api/vm/{vm_id}
      required:
      - vm_id
      properties:
        vm_id:
          type: string
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: Token
