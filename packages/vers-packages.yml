generated: '2026-07-21'
method: searched
source: https://docs.vers.sh/sdks
note: >-
  Vers publishes official SDKs for 9 languages, all auto-generated from the
  OpenAPI spec (hdresearch/chelsea) by Sterling (hdresearch/sterling) and
  published to package registries on every API change. All accept an API key
  via constructor or the VERS_API_KEY environment variable.
packages:
  - language: typescript
    registry: npm
    name: vers-sdk
    url: https://www.npmjs.com/package/vers-sdk
    install: npm install vers-sdk
    repository: https://github.com/hdresearch/ts-sdk
    official: true
  - language: python
    registry: pypi
    name: vers-sdk
    url: https://pypi.org/project/vers-sdk/
    install: pip install vers-sdk
    repository: https://github.com/hdresearch/python-sdk
    official: true
  - language: go
    registry: pkg.go.dev
    name: github.com/hdresearch/go-sdk
    url: https://pkg.go.dev/github.com/hdresearch/go-sdk
    install: go get github.com/hdresearch/go-sdk
    repository: https://github.com/hdresearch/go-sdk
    official: true
  - language: rust
    registry: crates.io
    name: vers-sdk
    url: https://crates.io/crates/vers-sdk
    install: cargo add vers-sdk
    repository: https://github.com/hdresearch/rust-sdk
    official: true
  - language: ruby
    registry: rubygems
    name: vers-sdk
    url: https://rubygems.org/gems/vers-sdk
    install: gem install vers-sdk
    repository: https://github.com/hdresearch/ruby-sdk
    official: true
  - language: csharp
    registry: nuget
    name: vers-sdk
    url: https://www.nuget.org/packages/vers-sdk
    install: dotnet add package vers-sdk
    repository: https://github.com/hdresearch/csharp-sdk
    official: true
  - language: java
    registry: maven
    name: com.vers:vers-sdk
    install: "maven: com.vers:vers-sdk (coming soon to Maven Central)"
    repository: https://github.com/hdresearch/java-sdk
    official: true
    status: coming-soon
  - language: kotlin
    registry: maven
    name: com.vers:vers-sdk
    install: 'implementation("com.vers:vers-sdk:0.1.8")'
    repository: https://github.com/hdresearch/kotlin-sdk
    official: true
  - language: php
    registry: packagist
    name: vers/sdk
    install: composer require vers/sdk
    repository: https://github.com/hdresearch/php-sdk
    official: true
cli:
  - name: vers
    kind: cli
    install: "curl -sSL https://vers.sh/api/install | bash"
    binary_path: /usr/local/bin/vers
    repository: https://github.com/hdresearch/vers-cli
    docs: https://docs.vers.sh/installation
    official: true
