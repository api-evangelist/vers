overlay: 1.0.0
info:
  title: API Evangelist enhancements for Vers Orchestrator Control Plane API
  version: 1.0.0
extends: openapi/vers-openapi-original.json
actions:
  - target: $.info
    update:
      x-apievangelist-provider: vers
      x-apievangelist-product: "Vers — branchable compute / microVM control plane"
      x-apievangelist-homepage: https://vers.sh/
      x-apievangelist-docs: https://docs.vers.sh/
      x-apievangelist-github: https://github.com/hdresearch
      x-apievangelist-base-url: https://api.vers.sh
      x-apievangelist-auth: "bearer API key (VERS_API_KEY)"
  - target: $.servers
    update:
      - url: https://api.vers.sh
        description: "Vers production API (base path /api/v1). The published spec omits servers[]; added by API Evangelist from the documented VERS_URL."
  - target: $.info
    update:
      x-apievangelist-conventions:
        pagination: offset/limit
        idempotency: per-request idempotency-key override (SDK request layer)
        retries: exponential backoff, honors Retry-After
        error_envelope: "custom JSON {error, success:false} (not RFC 9457)"
      x-apievangelist-sdks: "9 official languages (vers-sdk), auto-generated by Sterling"
      x-apievangelist-mcp:
        - "vers mcp serve (platform tools)"
        - "https://docs.vers.sh/mcp (docs)"
