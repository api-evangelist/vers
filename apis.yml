name: Vers
description: >-
  Vers is "git for running compute" — a branchable microVM platform from HD
  Research (hdresearch) that lets you fork a live virtual machine (memory,
  processes, sockets and all) in roughly 258 microseconds, commit its state as
  an immutable content-addressable snapshot, and restore or branch that snapshot
  anywhere. Built for AI agent swarms, parallel scenario and database-state
  testing, CI preview environments, and time-travel debugging, Vers exposes a
  63-operation Orchestrator Control Plane API (OpenAPI 3.1) behind a bearer API
  key, plus a git-style CLI, official SDKs for nine languages, and two Model
  Context Protocol servers so coding agents can drive compute directly.
